name: deploy-demos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo directory to force-deploy (e.g. agentcore/01-first-agent)"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: opptora-state
  TF_STATE_REGION: eu-west-2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      demos: ${{ steps.detect.outputs.demos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed demos
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            demos=$(jq -c -n --arg d "${{ inputs.demo }}" '[$d]')
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            demos=$(./scripts/changed-demos.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          else
            demos=$(./scripts/changed-demos.sh "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "demos=$demos" >> "$GITHUB_OUTPUT"
          echo "Changed demos: $demos"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform validate (all demos + aws-setup)
        run: |
          for dir in aws-setup */*/terraform; do
            [ -d "$dir" ] || continue
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --format compact
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Ruff (agent code)
        uses: astral-sh/ruff-action@v3
      - name: Spelling
        uses: streetsidesoftware/cspell-action@v6
        with:
          incremental_files_only: false

  deploy:
    needs: [changes, quality]
    if: needs.changes.outputs.demos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJSON(needs.changes.outputs.demos) }}
    concurrency:
      group: deploy-${{ matrix.demo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ matrix.demo }}/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=terraform/demos/${{ matrix.demo }}/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION}"

      - name: Ensure ECR repository exists (bootstrap)
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.demo }}/terraform
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.agent || true

      - name: Set up QEMU (arm64 builds)
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - name: Build and push agent image
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f "${{ matrix.demo }}/agent/Dockerfile" ]; then
            echo "No agent image for this demo; skipping build"
            exit 0
          fi
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin \
            "$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          REPO_URL=$(terraform -chdir="${{ matrix.demo }}/terraform" output -raw ecr_repository_url 2>/dev/null || true)
          if [ -z "$REPO_URL" ]; then
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            REPO_URL="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/demos/${{ matrix.demo }}"
          fi
          # Tags are immutable; deploys reference the git SHA only
          docker buildx build --platform linux/arm64 \
            -t "${REPO_URL}:${GITHUB_SHA}" \
            --push "${{ matrix.demo }}/agent"

      - name: Terraform plan (PR)
        if: github.event_name == 'pull_request'
        working-directory: ${{ matrix.demo }}/terraform
        run: terraform plan -input=false -var="image_tag=${GITHUB_SHA}"

      - name: Terraform apply (main)
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.demo }}/terraform
        run: terraform apply -input=false -auto-approve -var="image_tag=${GITHUB_SHA}"
